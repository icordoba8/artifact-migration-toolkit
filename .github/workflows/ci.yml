name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# The evidence job reads only GitHub metadata. Main may reuse a fully tested
# feature-branch tree only if its squash commit carries this exact trailer:
#   CI-Validated-Review: <full 40-character feature-branch commit SHA>
# Without a trailer, the usual complete matrix runs on main. Invalid evidence
# fails closed. The required toolkit (ubuntu-latest) check name never changes.
# The Ubuntu shard count is SHARDS in the provenance script, the one place it is
# written: the matrix, the shard names and the reuse job list all derive from it.
permissions:
  contents: read
  actions: read

jobs:
  provenance:
    name: Verify tested-tree provenance
    runs-on: ubuntu-latest
    outputs:
      reused: ${{ steps.verify.outputs.reused }}
      shards: ${{ steps.verify.outputs.shards }}
    steps:
      - name: Match the squash tree to a successful Ubuntu candidate
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            // Shard k runs `pnpm providers:test:k`; package.json defines 1..SHARDS.
            const SHARDS = 4;
            core.setOutput('shards', JSON.stringify(Array.from({ length: SHARDS }, (_, i) => i + 1)));
            core.setOutput('reused', 'false');
            if (context.ref !== 'refs/heads/main') return;

            const { owner, repo } = context.repo;
            const { data: merged } = await github.rest.git.getCommit({
              owner, repo, commit_sha: context.sha,
            });
            const trailers = [...merged.message.matchAll(/^CI-Validated-Review: ([0-9a-f]{40})$/gm)];
            if (trailers.length === 0) {
              core.info('No verified-review trailer: run the full matrix on main.');
              return;
            }
            if (trailers.length !== 1 || merged.parents.length !== 1) {
              throw new Error('Invalid provenance: expected one review SHA and one squash parent.');
            }

            const reviewSha = trailers[0][1];
            const { data: review } = await github.rest.git.getCommit({
              owner, repo, commit_sha: reviewSha,
            });
            if (review.parents.length !== 1 ||
                review.parents[0].sha !== merged.parents[0].sha ||
                review.tree.sha !== merged.tree.sha) {
              throw new Error('Squash does not exactly match a one-commit review on its frozen parent.');
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'ci.yml', head_sha: reviewSha,
              event: 'push', per_page: 100,
            });
            const required = Array.from({ length: SHARDS },
              (_, i) => `toolkit shard ${i + 1}/${SHARDS} (ubuntu-latest)`).concat('toolkit (ubuntu-latest)');
            for (const run of runs) {
              if (run.head_sha !== reviewSha || run.conclusion !== 'success') continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, per_page: 100,
              });
              if (!required.every((name) =>
                jobs.some((job) => job.name === name && job.conclusion === 'success'))) continue;
              core.info(`Reusing ${required.length} successful Ubuntu jobs from candidate run ${run.id}`);
              core.setOutput('reused', 'true');
              return;
            }
            throw new Error('No successful complete Ubuntu CI run found for the exact review SHA.');

  # One stable required check for both full CI and verified-tree reuse.
  toolkit:
    name: toolkit (ubuntu-latest)
    needs: [provenance, ubuntu]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require existing verified evidence or every Ubuntu shard to succeed
        shell: bash
        run: |
          test "${{ needs.provenance.result }}" = success
          if test "${{ needs.provenance.outputs.reused }}" = true; then
            test "${{ needs.ubuntu.result }}" = skipped
          else
            test "${{ needs.ubuntu.result }}" = success
          fi

  ubuntu:
    needs: provenance
    if: ${{ needs.provenance.result == 'success' && needs.provenance.outputs.reused != 'true' }}
    # The engine drives real file locking, atomic renames, `git ls-files`, child
    # processes and path rendering. Ubuntu is the only CI and release platform;
    # Windows CI was removed (docs/ci-release-hardening.md -> "Windows CI
    # status"), and no Windows result is claimed.
    # `providers:test` is split per test file into duration-balanced shards
    # (`providers:test:k`); shard 2 also runs the engine and TypeScript
    # suites, the architecture gate and the golden and negative replay.
    name: toolkit shard ${{ matrix.shard }}/${{ strategy.job-total }} (ubuntu-latest)
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.provenance.outputs.shards) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install trusted-side ledger observer tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 strace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # providers-sync.mjs imports `yaml` and the engine requires
      # `ts-discovery-compiler`. A clean checkout that runs providers:check
      # before installing crashes on a missing module, so install comes first.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Byte-identical regeneration of all four provider trees, the ownership
      # manifest included. Reports MISSING / CHANGED / STALE and writes nothing.
      - name: Verify generated provider trees
        run: pnpm providers:check

      # R-1: no canonical or generated surface may name a consumer-relative
      # engine root. An operator who pastes one runs an engine that is not the
      # installed toolkit, or none at all. Repository-wide, no carve-outs --
      # the two files that discuss the retired literal write it split.
      - name: Scan for consumer-relative engine paths
        shell: bash
        run: |
          if git grep -n -E '\.agents/skills/(start-migration|migrate-artifact)/scripts' -- \
               skills providers scripts docs README.md .github; then
            echo "::error::a canonical or generated surface names a consumer-relative engine path"
            exit 1
          fi

      # Across all shards, every providers:test and engine:test file runs
      # exactly once, and the fast/heavy local tiers split them the same way.
      - name: Verify the shards partition providers:test and engine:test
        run: node scripts/check-shards.mjs ${{ strategy.job-total }}

      # Provider projection, ownership-safe pruning, the no-engine-in-providers
      # boundary, the canonical skill hashes in skills-lock.json, and the
      # installed adapter acceptance matrix for all four providers.
      - name: Run the provider generation and installation suites (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: pnpm providers:test:${{ matrix.shard }}

      # LLM-free replay of the installed lifecycle, compared step by step with
      # test/golden/installed-full-lifecycle.ndjson. The golden is regenerated
      # only locally (`pnpm rehearse --update`), never from CI output.
      - name: Replay the installed lifecycle against the golden trace
        if: ${{ matrix.shard == 2 }}
        run: pnpm rehearse

      # A one-byte history corruption must fail at verification, not at the
      # golden comparison.
      - name: Refuse a corrupted history in the replay
        if: ${{ matrix.shard == 2 }}
        run: pnpm rehearse:negative

      # Module entries, dependency direction, cycles, facades, provider trees,
      # filesystem writers, size pins, test imports and suite registration
      # (docs/architecture/a10-tests.md). Its own tests are in providers:test.
      - name: Check the engine architecture
        if: ${{ matrix.shard == 2 }}
        run: pnpm architecture:check

      # Lifecycle, formats, decisions, integrity, MCP, discovery, artifact, and
      # the external-installation / rendered-command path suites.
      # MC2: the capture suites drive a real browser (the runner's Google
      # Chrome through the pinned playwright-core); the gate makes a missing
      # browser a failure instead of a skip.
      - name: Run the engine suites
        if: ${{ matrix.shard == 2 }}
        env:
          ARTIFACT_MIGRATION_BROWSER_GATE: "1"
        run: pnpm engine:test

      - name: Run the TypeScript artifact suites
        if: ${{ matrix.shard == 2 }}
        run: pnpm engine:test:ts

  acceptance-node-22-13:
    # G6: the acceptance harness on the official runtime. Node 22.13.0 exact; unprivileged user namespaces
    # allowed on this ephemeral runner only, so the isolation, native PTY and lock tests run instead of
    # skipping; pnpm 11.21.0 verified by its pinned SHA-512. The SKIPs must be exactly G5's local-only one and the host-only H12 Codex CLI one.
    name: acceptance harness (Node 22.13.0, namespaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install trusted-side ledger observer tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3 strace

      - name: Allow unprivileged user namespaces (ephemeral runner)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Fetch pnpm 11.21.0 and verify its pinned SHA-512
        shell: bash
        run: |
          curl -fsS --proto =https -o "$RUNNER_TEMP/pnpm-11.21.0.tgz" https://registry.npmjs.org/pnpm/-/pnpm-11.21.0.tgz
          bash scripts/m15-pnpm.sh "$RUNNER_TEMP/pnpm-11.21.0.tgz" "$RUNNER_TEMP/pnpm-run"
          echo "$RUNNER_TEMP/pnpm-run/bin" >> "$GITHUB_PATH"
          echo "AMT_PNPM_TGZ=$RUNNER_TEMP/pnpm-11.21.0.tgz" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the acceptance harness suite (TAP)
        shell: bash
        run: |
          test "$(node --version)" = v22.13.0
          node --test --test-concurrency=1 --test-reporter=tap test/agent-e2e-acceptance.test.mjs | tee "$RUNNER_TEMP/acceptance.tap"

      - name: Fail on any unaccounted skip
        if: ${{ always() }}
        shell: bash
        run: |
          grep -E '^# (tests|pass|fail|skipped|todo) ' "$RUNNER_TEMP/acceptance.tap"
          # Exactly these SKIPs, each once: an extra one fails, and so does a missing one (the test vanished).
          expected=$(printf '%s\n' \
            '# SKIP host-only (H12): AMT_CODEX_CLI names no pinned Codex 0.165.0 CLI' \
            '# SKIP local-only (G5): downloads from the live npm registry; CI stays offline-deterministic' | sort)
          actual=$(grep -oE '# SKIP .*' "$RUNNER_TEMP/acceptance.tap" | sort)
          if [ "$actual" != "$expected" ]; then
            printf 'expected SKIPs:\n%s\nactual SKIPs:\n%s\n' "$expected" "$actual"
            echo "::error::SKIPs in test/agent-e2e-acceptance.test.mjs differ from the accounted set"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: acceptance-node-22.13.0-tap
          path: ${{ runner.temp }}/acceptance.tap
