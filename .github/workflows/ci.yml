name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# The evidence job reads only GitHub metadata. Main may reuse a fully tested
# feature-branch tree only if its squash commit carries this exact trailer:
#   CI-Validated-Review: <full 40-character feature-branch commit SHA>
# Without a trailer, the usual complete matrix runs on main. Invalid evidence
# fails closed. The required toolkit (ubuntu-latest) check name never changes.
permissions:
  contents: read
  actions: read

jobs:
  provenance:
    name: Verify tested-tree provenance
    runs-on: ubuntu-latest
    outputs:
      reused: ${{ steps.verify.outputs.reused }}
    steps:
      - name: Match the squash tree to a successful Ubuntu candidate
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('reused', 'false');
            if (context.ref !== 'refs/heads/main') return;

            const { owner, repo } = context.repo;
            const { data: merged } = await github.rest.git.getCommit({
              owner, repo, commit_sha: context.sha,
            });
            const trailers = [...merged.message.matchAll(/^CI-Validated-Review: ([0-9a-f]{40})$/gm)];
            if (trailers.length === 0) {
              core.info('No verified-review trailer: run the full matrix on main.');
              return;
            }
            if (trailers.length !== 1 || merged.parents.length !== 1) {
              throw new Error('Invalid provenance: expected one review SHA and one squash parent.');
            }

            const reviewSha = trailers[0][1];
            const { data: review } = await github.rest.git.getCommit({
              owner, repo, commit_sha: reviewSha,
            });
            if (review.parents.length !== 1 ||
                review.parents[0].sha !== merged.parents[0].sha ||
                review.tree.sha !== merged.tree.sha) {
              throw new Error('Squash does not exactly match a one-commit review on its frozen parent.');
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'ci.yml', head_sha: reviewSha,
              event: 'push', per_page: 100,
            });
            const required = [
              'toolkit shard 1/3 (ubuntu-latest)',
              'toolkit shard 2/3 (ubuntu-latest)',
              'toolkit shard 3/3 (ubuntu-latest)',
              'toolkit (ubuntu-latest)',
            ];
            for (const run of runs) {
              if (run.head_sha !== reviewSha || run.conclusion !== 'success') continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, per_page: 100,
              });
              if (!required.every((name) =>
                jobs.some((job) => job.name === name && job.conclusion === 'success'))) continue;
              core.info('Reusing four successful Ubuntu jobs from candidate run ' + run.id);
              core.setOutput('reused', 'true');
              return;
            }
            throw new Error('No successful complete Ubuntu CI run found for the exact review SHA.');

  # One stable required check for both full CI and verified-tree reuse.
  toolkit:
    name: toolkit (ubuntu-latest)
    needs: [provenance, ubuntu]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require existing verified evidence or every Ubuntu shard to succeed
        shell: bash
        run: |
          test "${{ needs.provenance.result }}" = success
          if test "${{ needs.provenance.outputs.reused }}" = true; then
            test "${{ needs.ubuntu.result }}" = skipped
          else
            test "${{ needs.ubuntu.result }}" = success
          fi

  ubuntu:
    needs: provenance
    if: ${{ needs.provenance.result == 'success' && needs.provenance.outputs.reused != 'true' }}
    # The engine drives real file locking, atomic renames, `git ls-files`, child
    # processes and path rendering. Ubuntu is the only CI and release platform;
    # Windows CI was removed (docs/ci-release-hardening.md -> "Windows CI
    # status"), and no Windows result is claimed.
    # `providers:test` is split per test file into three shards; shard 3 also
    # runs the engine suites.
    name: toolkit shard ${{ matrix.shard }}/3 (ubuntu-latest)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # providers-sync.mjs imports `yaml` and the engine requires
      # `ts-discovery-compiler`. A clean checkout that runs providers:check
      # before installing crashes on a missing module, so install comes first.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Byte-identical regeneration of all four provider trees, the ownership
      # manifest included. Reports MISSING / CHANGED / STALE and writes nothing.
      - name: Verify generated provider trees
        run: pnpm providers:check

      # R-1: no canonical or generated surface may name a consumer-relative
      # engine root. An operator who pastes one runs an engine that is not the
      # installed toolkit, or none at all. Repository-wide, no carve-outs --
      # the two files that discuss the retired literal write it split.
      - name: Scan for consumer-relative engine paths
        shell: bash
        run: |
          if git grep -n -E '\.agents/skills/(start-migration|migrate-artifact)/scripts' -- \
               skills providers scripts docs README.md .github; then
            echo "::error::a canonical or generated surface names a consumer-relative engine path"
            exit 1
          fi

      # The shards must run every providers:test file exactly once.
      - name: Verify the shards partition providers:test
        shell: bash
        run: |
          node -e '
            const s = require("./package.json").scripts;
            const files = (k) => s[k].split(/\s+/).filter((t) => t.endsWith(".mjs"));
            const shards = [1, 2, 3].flatMap((n) => files(`providers:test:${n}`));
            if (shards.length !== new Set(shards).size ||
                JSON.stringify([...shards].sort()) !== JSON.stringify(files("providers:test").sort())) {
              console.error("::error::providers:test:1..3 must partition providers:test exactly");
              process.exit(1);
            }'

      # Provider projection, ownership-safe pruning, the no-engine-in-providers
      # boundary, the canonical skill hashes in skills-lock.json, and the
      # installed adapter acceptance matrix for all four providers.
      - name: Run the provider generation and installation suites (shard ${{ matrix.shard }}/3)
        run: pnpm providers:test:${{ matrix.shard }}

      # LLM-free replay of the installed lifecycle, compared step by step with
      # test/golden/installed-full-lifecycle.ndjson. The golden is regenerated
      # only locally (`pnpm rehearse --update`), never from CI output.
      - name: Replay the installed lifecycle against the golden trace
        if: ${{ matrix.shard == 2 }}
        run: pnpm rehearse

      # A one-byte history corruption must fail at verification, not at the
      # golden comparison.
      - name: Refuse a corrupted history in the replay
        if: ${{ matrix.shard == 2 }}
        run: pnpm rehearse:negative

      # Module entries, dependency direction, cycles, facades, provider trees,
      # filesystem writers, size pins, test imports and suite registration
      # (docs/architecture/a10-tests.md). Its own tests are in providers:test:3.
      - name: Check the engine architecture
        if: ${{ matrix.shard == 3 }}
        run: pnpm architecture:check

      # Lifecycle, formats, decisions, integrity, MCP, discovery, artifact, and
      # the external-installation / rendered-command path suites.
      - name: Run the engine suites
        if: ${{ matrix.shard == 3 }}
        run: pnpm engine:test

      - name: Run the TypeScript artifact suites
        if: ${{ matrix.shard == 3 }}
        run: pnpm engine:test:ts
